<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greenhold demo</title>
<meta name="description" content="A demo of the Greenhold Manager with made-up data.">
<style>
  :root { color-scheme: light dark; --bg: #f5f2ec; --text: #12301f; --muted: #4a5a50; --accent: #1f5c3a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111814; --text: #e6efe9; --muted: #a9b8ae; --accent: #7fc79a; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 4rem 1rem; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 1rem; }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Greenhold demo</h1>
  <p>The demo of the Greenhold Manager is not online yet. It will show the main pages with made-up data, so you can see how Greenhold looks and works.</p>
  <p>Until then, read the <a href="https://docs.greenhold.eu/">Greenhold documentation</a>.</p>
</main>
</body>
</html>
